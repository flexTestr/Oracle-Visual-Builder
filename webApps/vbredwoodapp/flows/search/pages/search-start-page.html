<oj-sp-smart-search-page class="oj-flex-item oj-sm-12 oj-md-12" page-title="Search Departments" display-mode="mixed"
  primary-action.label="Create New"
  secondary-actions='[{"id":"SecondryAction1","label":"Secondry Action 1"},{"id":"SecondryAction2","label":"Secondry Action 2"}]'
  page-subtitle="oj-sp-smart-search-page" on-sp-primary-action="[[$listeners.smartSearchPageTemplateSpPrimaryAction]]">
  <oj-input-search class="oj-form-control-width-md" slot="search" raw-value="{{ $variables.searchString }}"></oj-input-search>
  <div class="oj-sm-padding-4x">
    <oj-table scroll-policy="loadMoreOnScroll" data="[[$variables.departmentsListSDP]]"
      columns='[{"headerText":"Name","field":"departmentName"},{"headerText":"Id","field":"departmentId"},{"headerText":"Manager","field":"managerId"},{"headerText":"Location","field":"locationId"}]'
      style="width:100%;max-height: 90vh;"></oj-table>
  </div>
  
</oj-sp-smart-search-page>
