<oj-sp-guided-process process-title="New Hire" current-step="{{$page.variables.currentStep}}"
  on-sp-before-step-navigate="[[$listeners.onSpBeforeStepNavigate]]" on-sp-cancel="[[$listeners.onSpCancel]]"
  steps='[{"id":"1","title":"Personal Information","description":"","display":"on","status":"","timestamp":""},{"id":"2","title":"Employment","description":"","display":"on","status":"","optional":"","timestamp":""},{"id":"3","title":"Data Privacy","description":"","display":"on","status":"","optional":"","timestamp":""}]'
  primary-action.label="Submit" on-sp-primary-action="[[$listeners.guidedProcessPageTemplateSpPrimaryAction]]">
  <oj-validation-group id="validationGroup" valid="{{ $page.variables.valid }}">
    <oj-bind-if test="[[ $variables.currentStep == 1 ]]">
      <div>
        <oj-form-layout id="personal-information" direction="row" max-columns="2">
          <oj-input-text id="firstname" label-hint="First Name" required="true"></oj-input-text>
          <oj-input-text id="lastname" label-hint="Last Name" required="true"></oj-input-text>
          <oj-input-text id="address" label-hint="Address" autocomplete="off"></oj-input-text>
          <oj-form-layout direction="row" columns="2">
            <oj-select-single id="state" label-hint="State"></oj-select-single>
            <oj-input-text id="zip" label-hint="Zip"></oj-input-text>
          </oj-form-layout>
          <oj-input-text id="phone" label-hint="Phone"></oj-input-text>
          <oj-input-text id="email" label-hint="Email"></oj-input-text>
        </oj-form-layout>
      </div>
    </oj-bind-if>
    <oj-bind-if test="[[ $variables.currentStep == 2 ]]">
      <div>
        <oj-form-layout id="employment-eligibility" direction="row" max-columns="2">
          <oj-radioset label-hint="Are you authorized to work in the United States?" id="work-authorization"
            required="true">
            <oj-option value="yes">Yes, I am authorized</oj-option>
            <oj-option value="no">No, I am not authorized</oj-option>
          </oj-radioset>
          <oj-radioset label-hint="Do you require sponsorship for employment visa status?" id="sponsorship"
            required="true">
            <oj-option value="yes">Yes</oj-option>
            <!-- <oj-combobox-one id="sponsorship-type" label-hint="Visa Type"></oj-combobox-one> -->
            <oj-option value="no">No</oj-option>
          </oj-radioset>
        </oj-form-layout>
      </div>
      <div class="oj-flex">
        <h6 class="oj-header oj-flex-item oj-sm-12 oj-md-12">Employment History</h6>
      </div>
      <div class="oj-flex">
        <oj-sp-collection-container display-options.add="on" display-options.delete="on"
          on-sp-add="[[$listeners.collectionContainerSpAdd]]" on-sp-delete="[[$listeners.collectionContainerSpDelete]]">
          <oj-table scroll-policy="loadMoreOnScroll" class="oj-flex-item oj-sm-12 oj-md-12"
            data="[[ $variables.empHistoryTypeVar ]]"
            columns='[{"headerText":"Name","field":"name"},{"headerText":"Title","field":"title"},{"headerText":"From","field":"start"},{"headerText":"To","field":"end"}]'>
          </oj-table>
        </oj-sp-collection-container>
      </div>
    </oj-bind-if>
    <oj-bind-if test="[[ $variables.currentStep == 3 ]]">
      <div>
        <oj-form-layout id="data-privacy" direction="row">
          <oj-checkboxset id="app-details" required="true">
            <oj-option value="agree">
              I agree my application details may be stored in the Oracle Global Recruiting database for 24
              months.
            </oj-option>
          </oj-checkboxset>
        </oj-form-layout>

        <h2 class="oj-typography-subheading-xs">Job Posting Notification</h2>
        <oj-form-layout id="job-posting" direction="row">
          <oj-checkboxset id="notification">
            <oj-option value="send">
              Send an email notification whenever a new position matching this profile is posted.
            </oj-option>
          </oj-checkboxset>
        </oj-form-layout>
      </div>
    </oj-bind-if>
  </oj-validation-group>
</oj-sp-guided-process>
<oj-sp-message-unsaved-changes id="dirtyDataWarningDialog"
  on-oj-sp-discard-changes="[[ $listeners.onConfirmYesOjAction ]]"
  on-oj-sp-cancel="[[ $listeners.onConfirmNoOjAction ]]">
</oj-sp-message-unsaved-changes>

<oj-drawer-popup id="oj-drawer-request" auto-dismiss="none" opened="{{ $variables.drawerOpen }}" edge="end">
  <oj-sp-create-edit-drawer-template drawer-title="Employment Details" primary-action.label="Save"
    primary-action.display="on" secondary-action.display="off"
    on-sp-cancel="[[$listeners.createEditDrawerTemplateSpCancel]]"
    on-sp-primary-action="[[$listeners.createEditDrawerTemplateSpPrimaryAction]]">
    <div class="oj-flex">
      <div class="oj-flex-item oj-sm-12 oj-md-12">
        <oj-validation-group id="employement-form" valid="{{ $variables.empHistoryValid }}">
          <oj-form-layout class="oj-flex-item oj-sm-12 oj-md-12">
            <oj-input-text id="employer" label-hint="Employer Name" value="{{ $variables.currentRow.name }}"
              required="true">
            </oj-input-text>
            <oj-input-text id="position" label-hint="Position/Job Title" value="{{ $variables.currentRow.title }}">
            </oj-input-text>
            <oj-form-layout direction="row" columns="2">
              <oj-input-date id="start-date" label-hint="Start Date" autocomplete="off"
                value="{{ $variables.currentRow.start }}" required="true"></oj-input-date>
              <oj-input-date id="end-date" label-hint="End Date" autocomplete="off"
                value="{{ $variables.currentRow.end }}" required="true"></oj-input-date>
            </oj-form-layout>
            <oj-input-text id="reference" label-hint="Contact Reference" value="{{ $variables.currentRow.reference }}">
            </oj-input-text>
            <oj-text-area id="description" label-hint="Description" slot="value"
              value="{{ $variables.currentRow.description }}">
            </oj-text-area>
            <oj-input-text id="empAddress" label-hint="Employer Address" slot="value"
              value="{{ $variables.currentRow.address }}"></oj-input-text>
          </oj-form-layout>
        </oj-validation-group>
      </div>
    </div>
  </oj-sp-create-edit-drawer-template>
</oj-drawer-popup>
